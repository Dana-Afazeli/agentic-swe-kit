[[new_skips]]
name = "skips imported by name, and unittest's (PR #5 review, round 2)"
diff = '''
diff --git a/tests/b.py b/tests/b.py
new file mode 100644
--- /dev/null
+++ b/tests/b.py
@@ -0,0 +1,14 @@
+import unittest
+from pytest import importorskip, skip, xfail
+np = importorskip("numpy")
+def test_one() -> None:
+    skip("later")
+def test_two() -> None:
+    xfail("known")
+@unittest.skip("later")
+@unittest.skipIf(True, "never")
+@unittest.skipUnless(False, "never")
+@unittest.expectedFailure
+def test_three() -> None:
+    raise unittest.SkipTest("later")
+skipped = "a word, not a call"
'''
findings = [
    'tests/b.py:3: np = importorskip("numpy")',
    'tests/b.py:5: skip("later")',
    'tests/b.py:7: xfail("known")',
    'tests/b.py:8: @unittest.skip("later")',
    'tests/b.py:9: @unittest.skipIf(True, "never")',
    'tests/b.py:10: @unittest.skipUnless(False, "never")',
    'tests/b.py:11: @unittest.expectedFailure',
    'tests/b.py:13: raise unittest.SkipTest("later")',
]

