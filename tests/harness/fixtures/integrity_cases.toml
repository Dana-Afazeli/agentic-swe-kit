# ---------------------------------------------------------------- check(), end to end
# A throwaway repository: `base` is committed on branch main, `head` is committed on top of it on a
# feature branch, `untracked` is written and never added (one of its files is ignored by git).

[end_to_end.base]
"tests/test_t.py" = '''
import pytest


def test_kept() -> None:
    assert True


def test_removed() -> None:
    assert True


@pytest.mark.parametrize("n", [1, 2])
def test_cases(n: int) -> None:
    assert n


def test_marked_later() -> None:
    assert True
'''
"src/pkg/a.py" = '''
x = 1
'''
".gitignore" = '''
tests/scratch_*.py
'''

[end_to_end.head]
"tests/test_t.py" = '''
import pytest


def test_kept() -> None:
    assert True


@pytest.mark.skip(reason="later")
def test_new() -> None:
    assert True


@pytest.mark.parametrize("n", [1])
def test_cases(n: int) -> None:
    assert n


@pytest.mark.eval
def test_marked_later() -> None:
    assert True
'''
"src/pkg/a.py" = '''
x = 1
y = 2  # noqa: E501
'''
"scripts/tool.py" = '''
import os  # noqa: F401
'''
"tests/helpers.py" = '''
count: int = "three"  # type: ignore[assignment]
'''

[end_to_end.untracked]
"conftest.py" = '''
import pytest


def pytest_collection_modifyitems(items: list[pytest.Item]) -> None:
    items[0].add_marker(pytest.mark.skip)
'''
"tests/test_untracked.py" = '''
import pytest


def test_later() -> None:
    pytest.skip("x")
'''
"src/pkg/b.py" = '''
z = 3  # pragma: no cover
'''
"tests/empty.py" = ""
"tests/scratch_ignored.py" = '''
import pytest


@pytest.mark.skip(reason="ignored by git, so not part of any change")
def test_scratch() -> None:
    assert True
'''

[end_to_end.expected]
# test_marked_later is still collected, but the marker took it out of `make check`
vanished = [
    "tests/test_t.py::test_cases[2]",
    "tests/test_t.py::test_marked_later",
    "tests/test_t.py::test_removed",
]
skips = [
    'tests/test_t.py:8: @pytest.mark.skip(reason="later")',
    'conftest.py:5: items[0].add_marker(pytest.mark.skip)',
    'tests/test_untracked.py:5: pytest.skip("x")',
]
escapes = [
    'scripts/tool.py:1: import os  # noqa: F401',
    'src/pkg/a.py:2: y = 2  # noqa: E501',
    'tests/helpers.py:1: count: int = "three"  # type: ignore[assignment]',
    'src/pkg/b.py:1: z = 3  # pragma: no cover',
]
