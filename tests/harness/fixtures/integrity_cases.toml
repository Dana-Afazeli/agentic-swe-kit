# Cases for tests/test_integrity.py: each diff is the input, `findings` the exact output.
#
# They live in a data file, not in the test module, because the test module is itself scanned by
# the gate it tests: a skip marker or an escape-hatch comment written out in a `.py` file under
# tests/ would be reported as a weakened check in every PR that touches that file.

# ---------------------------------------------------------------- new_skips (criterion 7)

